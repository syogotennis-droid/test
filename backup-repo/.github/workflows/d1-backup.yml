name: D1 daily backup

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00 (日本時間)
  workflow_dispatch:        # Actions画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash backup.sh

      - name: Commit backups
        if: always()
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A backups
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "backup $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
