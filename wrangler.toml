# ローカル開発用の設定です（本番の案件はこのファイルを使いません）。
# 本番の作成・デプロイは `node setup-new-client.js` が案件ごとの設定を自動で作ります。
#
#   npx wrangler d1 execute qr-attendance-db --local --file=./schema.sql
#   npm run build && npx wrangler pages dev dist

name = "qr-attendance"
compatibility_date = "2024-09-25"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "qr-attendance-db"
database_id = "local-dev"
